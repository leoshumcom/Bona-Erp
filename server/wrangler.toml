name = "bona-erp-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 路由配置
[[routes]]
pattern = "api.bona-official.com/*"
zone_id = ""  # 填入你的域名 Zone ID

# 环境变量（生产环境）
[vars]
NODE_ENV = "production"
JWT_SECRET = ""  # 在 Cloudflare Dashboard 设置

# D1 数据库（可选，如使用 D1 替代 PostgreSQL）
# [[d1_databases]]
# binding = "DB"
# database_name = "bona-erp-db"
# database_id = ""

# KV 命名空间（缓存用）
# [[kv_namespaces]]
# binding = "CACHE"
# id = ""

# R2 存储（文件上传用）
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "bona-erp-files"

# 环境特定配置
[env.production]
routes = [{ pattern = "api.bona-official.com/*", zone_id = "" }]

[env.staging]
name = "bona-erp-api-staging"
